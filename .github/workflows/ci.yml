name: CMake CI and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build library, example, tests and benchmark
        run: cmake --build build --config Release --parallel 2
      - name: Run unit and demo tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit tests.xml
      - name: Run example
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/quantlab_demo.exe
          else
            ./build/quantlab_demo
          fi
      - name: Measure performance (Release)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exe=./build/benchmarks/Release/quantlab_benchmark.exe
          else
            exe=./build/benchmarks/quantlab_benchmark
          fi
          "$exe" --benchmark_min_time=0.05s --benchmark_repetitions=3 \
            --benchmark_out=build/benchmark-results.json --benchmark_out_format=json \
            --benchmark_color=false 2>&1 | tee build/benchmark-results.txt
      - name: Publish test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.os }}
          path: |
            build/tests.xml
            build/benchmark-results.json
            build/benchmark-results.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
      - name: Add benchmark results to run summary
        if: success()
        shell: bash
        run: |
          echo '### Google Benchmark (Release)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build/benchmark-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure sanitized Debug build
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DQUANTLAB_ENABLE_SANITIZERS=ON -DQUANTLAB_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure --no-tests=error

  documentation:
    name: Build Doxygen documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y doxygen
      - name: Configure documentation
        run: cmake -S . -B build-docs -DBUILD_TESTING=OFF -DQUANTLAB_BUILD_BENCHMARKS=OFF -DQUANTLAB_BUILD_DOCS=ON
      - name: Generate HTML (warnings are errors)
        run: cmake --build build-docs --target docs
      - name: Validate generated site
        run: test -s build-docs/docs/html/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build-docs/docs/html

  deploy:
    name: Publish documentation to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-test, sanitizers, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy generated documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
